[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agent4x-app"
version = "0.1.0"
description = "Traceable, revisable technical decisions with DeepAgents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepagents==0.6.12",
    "langchain==1.3.11",
    "langchain-core==1.5.2",
    "langchain-anthropic==1.5.4",
    "langsmith==0.8.18",
    "tavily-python==0.7.26",
    "httpx==0.28.1",
    "python-dotenv==1.2.2",
    "pydantic==2.13.4",
]

[project.scripts]
agent4x = "agent4x.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent4x"]

[tool.uv]
constraint-dependencies = [
    "annotated-types==0.7.0",
    "anthropic==0.120.0",
    "anyio==4.15.1",
    "beautifulsoup4==4.14.2",
    "bracex==2.6",
